# Rutas de Angry Ball dentro del server HTTPS de astragal.duckdns.org.
# Se instala en /etc/nginx/angryball/locations.conf (provision.sh) y lo incluye
# everweave.conf de Astragal con:
#     include /etc/nginx/angryball/*.conf;
# Va en /etc y no en el home porque SELinux no deja que nginx lea archivos de
# /home sin reetiquetarlos.

location ^~ /angryball/api/ {
    limit_req zone=angryball_api burst=60 nodelay;
    limit_req_status 429;

    # Con la barra final, nginx saca el prefijo: /angryball/api/scores → /scores
    proxy_pass http://127.0.0.1:3010/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 16k;
    proxy_read_timeout 15s;
}

# La URL de borrado de cuenta que se declara en Google Play.
location = /angryball/borrar-cuenta {
    proxy_pass http://127.0.0.1:3010/borrar-cuenta;
    proxy_set_header Host $host;
}
location = /angryball/delete-account {
    proxy_pass http://127.0.0.1:3010/delete-account;
    proxy_set_header Host $host;
}
