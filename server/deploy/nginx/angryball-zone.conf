# Zona de límite de pedidos de Angry Ball. Va en /etc/nginx/conf.d/ (contexto
# http), aparte de las de Astragal: así una ráfaga contra el ranking no le come
# el cupo a los jugadores de Astragal detrás de la misma IP, ni al revés.
limit_req_zone $binary_remote_addr zone=angryball_api:10m rate=10r/s;
