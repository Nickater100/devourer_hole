# La API de Angry Ball (server/): tests en cada push que la toque, y en main
# imagen arm64 a GHCR + deploy al servidor de Astragal.
#
# Secretos (Settings → Secrets and variables → Actions), ver server/deploy/README.md:
#   ANGRYBALL_DEPLOY_SSH_KEY  clave privada atada en el servidor a ~/angryball/deploy.sh
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_KNOWN_HOSTS
# Si faltan, la imagen se publica igual y el deploy avisa y no hace nada.
name: API de Angry Ball

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

concurrency:
  group: angryball-api-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nickater100/angryball-api

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  # En los PR se arma la imagen para validar el Dockerfile, sin publicarla.
  image:
    needs: test
    # El servidor es aarch64: armar en un runner ARM evita emular con QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Desplegar en el servidor
        env:
          SSH_KEY: ${{ secrets.ANGRYBALL_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$USER_NAME" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::warning::Faltan secretos de deploy: la imagen quedó publicada pero no se desplegó (ver server/deploy/README.md)."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # El forced command ignora lo que se mande: siempre corre ~/angryball/deploy.sh
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER_NAME@$HOST" deploy

      - name: Verificar desde afuera
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          [ -z "$HOST" ] && exit 0
          curl -fsS --retry 5 --retry-delay 3 https://astragal.duckdns.org/angryball/api/health
