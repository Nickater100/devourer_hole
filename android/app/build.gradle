apply plugin: 'com.android.application'

android {
    namespace = "com.nickater.devourer"
    // BuildConfig.DEBUG lo usa AppodealPlugin para forzar anuncios de prueba.
    buildFeatures {
        buildConfig = true
    }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nickater.devourer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /*
     * Firma de release. La CI pasa todo por variables de entorno (ver
     * .github/workflows/release.yml); en local, si no están, el release sale sin
     * firmar y se firma desde Android Studio como antes.
     */
    signingConfigs {
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    /*
     * Appodeal (reemplaza a AdMob, cuya cuenta fue bloqueada). Sale del
     * generador oficial (docs.appodeal.com/android/advanced/configure-mediated-networks)
     * con el motor de Appodeal y SUS adaptadores, SIN:
     *  - AdMob y Google Ad Manager: la cuenta de Google está bloqueada.
     *  - los motores de terceros (AppLovin MAX, Level Play, Bidon): cada uno trae
     *    su propia pila de adaptadores y no hace falta para empezar.
     *  - myTarget (VK): su adaptador fija la Play Billing Library en [7, 8), y Play
     *    RECHAZA cualquier AAB con Billing menor a 8 — el primer release
     *    automático rebotó por eso.
     *  - los servicios (Adjust, AppsFlyer, Firebase, Meta Analytics, Sentry): son
     *    para campañas de adquisición; Firebase además choca con el del juego.
     */
    def appodealAdapters = [
        'amazon:12.0.0.0', 'applovin:13.6.3.0', 'bidmachine:3.7.1.0', 'bigo_ads:5.9.0.0',
        'chartboost:9.10.2.0', 'dt_exchange:8.4.6.0', 'iab:1.8.1.1', 'inmobi:11.3.0.0',
        'meta:6.21.0.0', 'mintegral:17.1.61.0', 'mobilefuse:1.11.0.0', 'moloco:4.3.1.0',
        'ogury:6.2.0.0', 'pubmatic:4.10.0.0', 'smaato:22.7.2.0',
        'startio:5.2.4.0', 'taurusx:1.12.2.0', 'unity_ads:4.17.0.0', 'verve:3.7.1.0',
        'vungle:7.7.4.0', 'yandex:7.17.0.0',
    ]
    implementation 'com.appodeal.ads.sdk:core:4.4.0'
    appodealAdapters.each { implementation "com.appodeal.ads.sdk.adapters:$it" }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
