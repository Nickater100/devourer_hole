apply plugin: 'com.android.application'

android {
    namespace = "com.nickater.devourer"
    // BuildConfig.DEBUG lo usa LevelPlayPlugin para abrir el Test Suite sólo en debug.
    buildFeatures {
        buildConfig = true
    }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nickater.devourer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /*
     * Firma de release. La CI pasa todo por variables de entorno (ver
     * .github/workflows/release.yml); en local, si no están, el release sale sin
     * firmar y se firma desde Android Studio como antes.
     */
    signingConfigs {
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            /*
             * `-optimize` y no `proguard-android.txt`: ese trae -dontoptimize y
             * Play marcaba la optimización del DEX en 0% (exige 25% desde
             * febrero de 2027).
             */
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    /*
     * Unity LevelPlay (ex ironSource), el mismo mediador de Astragal. El puente
     * con el juego es LevelPlayPlugin.java, en esta misma app.
     *
     * LevelPlay es un MEDIADOR: cada red se suma con su adaptador acá Y se activa
     * en el panel (platform.ironsrc.com, app "Angry Ball"). Un adaptador que no
     * está compilado no se puede activar desde el panel: hace falta una versión
     * nueva en Play.
     *
     * Cada par es adaptador + SDK de la red, y LA VERSIÓN DEL SDK NO SE ELIGE: es
     * la que declara el CHANGELOG de ese adaptador
     * (github.com/ironsource-mobile/levelplay-android-adapters). Subir uno sin
     * el otro compila y la red no muestra nada.
     *
     * El mediation-sdk va en 9.6.1 porque es el mínimo del adaptador de AdMob; los
     * demás lo aceptan. ironSource Ads viene dentro del mediation-sdk.
     */
    implementation 'com.unity3d.ads-mediation:mediation-sdk:9.6.1'
    implementation 'com.unity3d.ads-mediation:unityads-adapter:5.13.0'   // Unity Ads
    implementation 'com.unity3d.ads:unity-ads:4.20.1'
    implementation 'com.unity3d.ads-mediation:vungle-adapter:5.15.0'     // Liftoff
    implementation 'com.vungle:vungle-ads:7.7.8'

    /*
     * ADMOB, COMO UNA RED MÁS DE LEVELPLAY (y no con su plugin de Capacitor, que
     * se sacó). Desde el adaptador 5.10.0 usa el SDK "Next Gen" de Google
     * (ads-mobile-sdk) y no play-services-ads: el App ID YA NO SE LEE DEL
     * MANIFIESTO, LevelPlay lo pasa al iniciar desde su panel (SDK Networks →
     * AdMob). Desde el 5.18.0 el adaptador declara su SDK como dependencia. Los
     * dos SDK de Google Ads no pueden convivir: si alguna dependencia trajera
     * play-services-ads, el build falla por clases duplicadas.
     */
    implementation 'com.unity3d.ads-mediation:admob-adapter:5.19.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
